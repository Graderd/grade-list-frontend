<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Grade List</title>
</head>
<body>
    <header>
        <!-- identidad de la aplicación -->
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo de Grade List">
            <span>Grade List</span>
        </a>

        <!-- Informacion del usuario -->
        <div class="usuario">
            <img src="home.png" alt="Foto de perfil del usuario">

            <div class="usuario-info">
                <p>Hola, Usuario</p>
                <button type="button">Cerrar sesión</button>
            </div>
        </div>
    </header>

    <main>

        <h1>Mis tareas</h1>

        <!-- Área de mensajes -->
        <div id="mensajes" class="mensaje" aria-live="polite">mensaje</div>

        <!-- Título principal y resumen -->
        <section id="crear-tarea">
            <h2>Agregar nueva tarea</h2>
            <form id="formulario-tarea">
                <label for="titulo">Nueva tarea:</label>
                <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="¿Qué necesitas hacer?"
                minlength="3"
                required>
                <button type="submit">Agregar</button>
            </form>
        </section>

        <section id="filtros">
            <h2>Filtrar tareas</h2>
            <button type="button" class="filtro activo" data-filtro="todas" aria-pressed="true">
                Todas
            </button>
            <button type="button" class="filtro" data-filtro="pendientes" aria-pressed="false">
                Pendientes
            </button>
            <button type="button" class="filtro" data-filtro="completadas" aria-pressed="false">
                Completadas
            </button>
        </section>

        <section id="lista-tareas">
            <!-- Lista -->
            <h2>Lista de tareas</h2>
            <p id="contador-tareas">Tienes <span id="cantidad-tareas">0</span> tareas pendientes</p>
            <ul id="tareas">
                <li class="tarea" data-estado="pendiente">
                    <label><input type="checkbox" class="checkbox-tarea"><span class="titulo">Tarea de ejemplo</span></label>
                    <span class="estado">Pendiente</span>
                    <button type="button" class="editar">Editar</button>
                    <button type="button" class="eliminar">Eliminar</button>
                </li>
            </ul>
        </section>

    </main>

    <footer></footer>
</body>
</html>
