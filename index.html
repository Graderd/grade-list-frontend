<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Grade List</title>
</head>
<body>
    <header>
        <!-- identidad de la aplicación -->
        <a href="index.html" class="logo">
            <img src="image/logo4.png" alt="Logo de Grade List">
            <span>Grade List</span>
        </a>

        <!-- Informacion del usuario -->
        <div class="usuario">
            <img src="image/perfil-usuario.jpg" alt="Foto de perfil del usuario">

            <div class="usuario-info">
                <p>Hola, Usuario</p>
                <button type="button">Cerrar sesión</button>
            </div>
        </div>
    </header>

<main>
    <h1 class="visually-hidden">Mis tareas</h1>

    <!-- Tarjeta superior: formulario y filtros -->
    <div class="panel-controles">

        <section id="crear-tarea">
            <h2 >Nueva tarea</h2>

            <form id="formulario-tarea">
                <label for="titulo" class="visually-hidden">
                    Nueva tarea
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="¿Qué necesitas hacer?"
                    minlength="3"
                    required
                >

                <button type="submit">Agregar</button>
            </form>
        </section>

        <!-- Mensajes de éxito o error -->
        <div
            id="mensajes"
            class="mensaje"
            aria-live="polite"
        ></div>

        <section id="filtros">
            <h2 class="visually-hidden">Filtrar tareas</h2>

            <div class="grupo-filtros">
                <button
                    type="button"
                    class="filtro activo"
                    data-filtro="todas"
                    aria-pressed="true"
                >
                    Todas
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="pendientes"
                    aria-pressed="false"
                >
                    Pendientes
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="completadas"
                    aria-pressed="false"
                >
                    Completadas
                </button>
            </div>

            <p id="contador-tareas">
                <span id="cantidad-tareas">0</span> tareas
            </p>
        </section>

    </div>

    <!-- Tarjeta inferior: lista -->
    <section id="lista-tareas">
        <h2 class="visually-hidden">Lista de tareas</h2>

        <ul id="tareas">
            <li class="tarea" data-estado="pendiente">
                <label>
                    <input type="checkbox" class="checkbox-tarea">
                    <span class="titulo">Tarea de ejemplo</span>
                </label>

                <span class="estado">Pendiente</span>

                <button type="button" class="editar">
                    Editar
                </button>

                <button type="button" class="eliminar">
                    Eliminar
                </button>
            </li>
        </ul>
    </section>
</main>

    <footer></footer>
</body>
</html>
