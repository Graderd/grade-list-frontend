<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade List - Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/auth.css">

</head>
<body>
    <main>
        <section id="tarjeta-login" class="tarjeta-auth">
            
            <div class="auth-logo">
                <img src="./image/logo4.png" alt="Logo de Grade List">
                <span>Grade List</span>
            </div>

            <h1 class="visually-hidden">Iniciar sesión</h1>

            <p>Organiza tu día, logra más.</p>

            <div id="mensajes" class="mensaje" aria-live="polite"></div>

            <form id="formulario-login" class="formulario-auth" novalidate>
                <div class="form-input">
                <label for="correo">
                    Correo electrónico
                </label>

                    <div class="input-icono">
                        <span class="material-symbols-outlined">mail</span>
                        <input
                        type="email"
                        id="correo"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        maxlength="255"
                        required
                    >
                    </div>
                </div>

                <div class="form-input">
                <label for="password">
                    Contraseña
                </label>

                    <div class="input-icono">
                        <span class="material-symbols-outlined">lock</span>
                        <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        maxlength="72"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar-password"
                        aria-label="Mostrar contraseña"
                    >
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                    </div>
                </div>
                
                <button type="submit" class="boton-registro">
                    Iniciar sesión
                </button>
            </form>

            <div class="separador">
                <span></span>
                <p>o</p>
                <span></span>
            </div>

            <p>
                ¿No tienes una cuenta? <a href="register.html">Crear cuenta</a>
            </p>
        </section>
    </main>

    <script src="./js/login.js"></script>
</body>
</html>
